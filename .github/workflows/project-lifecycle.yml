name: DRF Project lifecycle

on:
  issues:
    types: [opened, labeled, assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches:
      - 'issue-*'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  transition:
    runs-on: [self-hosted, Linux, tbhrc, ai-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lifecycle transition
        id: transition
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          ASSIGNEE_LOGIN: ${{ github.event.assignee.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          issue=""
          target=""
          allowed=""

          if [ "$EVENT_NAME" = "issues" ]; then
            issue="$ISSUE_NUMBER"
            case "$ACTION" in
              opened)
                target="Inbox"
                ;;
              labeled)
                case "$LABEL_NAME" in
                  needs-research)
                    target="Research"
                    allowed="Inbox,Ready"
                    ;;
                  research-complete)
                    target="Ready"
                    allowed="Inbox,Research"
                    ;;
                  *) exit 0 ;;
                esac
                ;;
              assigned)
                case "$ASSIGNEE_LOGIN" in
                  Codex|'copilot-swe-agent[bot]'|'openai-code-agent[bot]'|'anthropic-code-agent[bot]')
                    target="Executing"
                    allowed="Inbox,Research,Ready"
                    ;;
                  *) exit 0 ;;
                esac
                ;;
              closed)
                target="Done"
                ;;
              reopened)
                target="Ready"
                ;;
              *) exit 0 ;;
            esac

          elif [ "$EVENT_NAME" = "push" ]; then
            [[ "$REF_NAME" =~ ^issue-([0-9]+)(-|$) ]] || exit 0
            issue="${BASH_REMATCH[1]}"
            target="Executing"
            allowed="Inbox,Research,Ready"

          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$ACTION" = "closed" ] && [ "$PR_MERGED" != "true" ]; then
              exit 0
            fi
            if [ "$ACTION" != "closed" ] && [ "$PR_DRAFT" = "true" ]; then
              exit 0
            fi

            data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences,body,headRefName)"
            issue="$(jq -r '.closingIssuesReferences[0].number // empty' <<<"$data")"
            if [ -z "$issue" ]; then
              body="$(jq -r '.body // ""' <<<"$data")"
              if [[ "$body" =~ (Refs|Fixes|Closes|Resolves)[[:space:]]+#([0-9]+) ]]; then
                issue="${BASH_REMATCH[2]}"
              fi
            fi
            if [ -z "$issue" ]; then
              head="$(jq -r '.headRefName' <<<"$data")"
              if [[ "$head" =~ ^issue-([0-9]+)(-|$) ]]; then
                issue="${BASH_REMATCH[1]}"
              fi
            fi
            test -n "$issue" || { echo 'No governing Issue could be resolved from PR.' >&2; exit 1; }

            if [ "$ACTION" = "closed" ]; then
              target="QA"
              allowed="Executing,Review"
            else
              target="Review"
              allowed="Inbox,Research,Ready,Executing"
            fi
          else
            exit 0
          fi

          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Apply lifecycle transition
        if: steps.transition.outputs.issue != ''
        uses: ./.github/actions/set-drf-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.transition.outputs.issue }}
          target-status: ${{ steps.transition.outputs.target }}
          allowed-current-statuses: ${{ steps.transition.outputs.allowed }}
